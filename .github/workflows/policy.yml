name: Proposed capture policy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test proposal/capture-policy.test.mjs
