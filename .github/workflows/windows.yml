name: Windows build and GPU color tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test actual HLSL on software D3D11
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: HdrBridge-windows-x64
          path: build/Release/HdrBridge.exe
      - name: Package optional VB-CABLE
        if: github.event_name != 'pull_request'
        run: ./scripts/package-audio.ps1
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: HdrBridge-windows-x64-with-audio
          path: build/audio-package/
          if-no-files-found: error
